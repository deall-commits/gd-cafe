<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="GD카페 예약 요청 — 서울 강남구 삼성로 716 (청담동) 2층. 원하시는 시간을 남겨주시면 매장에서 확인 후 회신드립니다.">
<title>예약 — GD카페</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0908'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='30' fill='%23e9d3a0'%3EGD%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   GD카페 예약 요청 — 명함 QR 이 도착하는 곳
   공개 사이트(index.html)와 같은 검은 샹들리에 톤.
   백엔드가 없으므로 「보낼 내용」을 만들어 손님이 보내는 구조다.
   ============================================================ */
:root {
  --noir: #0b0908; --panel: #151110; --panel-2: #1e1815; --line: #2e2721;
  --gold: #c6a15b; --gold-soft: #e9d3a0; --gold-dim: #7d6740;
  --ink: #f1e9d8; --ink-2: #b3a48a; --ink-3: #7f725d;
  --bad: #c96a5b;
  --serif: "Bodoni MT", "Didot", "Playfair Display", Georgia, serif;
  --sans: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo",
          "Noto Sans KR", "Malgun Gothic", sans-serif;
  --crest-fill: var(--gold-soft); --crest-line: var(--gold-soft); --crest-flame: #ffecbe;
  color-scheme: dark;
}
* { box-sizing: border-box; }
/* .btn 의 display 가 UA 의 [hidden] 을 이기므로 명시적으로 눌러준다 */
[hidden] { display: none !important; }
body { margin: 0; background: var(--noir); color: var(--ink); font-family: var(--sans);
       font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
.top { display: flex; align-items: baseline; gap: 10px; padding: 18px 20px;
       border-bottom: 1px solid var(--line); }
.brand { font-family: var(--serif); font-size: 23px; letter-spacing: .06em; color: var(--gold-soft); text-decoration: none; }
.top .sub { font-size: 10.5px; letter-spacing: .2em; color: var(--ink-3); }

.wrap { max-width: 460px; margin: 0 auto; padding: 26px 20px 72px; }
.crest { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.crest .ln { flex: 1; height: 0; border-top: 1px solid var(--line); }
.crest .swag { width: 116px; height: 21.75px; flex: none; }

h1 { font-family: var(--serif); font-size: 27px; letter-spacing: .01em; margin: 0 0 10px; }
.lead { color: var(--ink-2); margin: 0 0 14px; }
.notice { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 11px 13px; font-size: 14px; color: var(--ink-2); margin: 0 0 22px; }
.notice b { color: var(--gold-soft); font-weight: 600; }

form { display: flex; flex-direction: column; gap: 13px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld > span { font-size: 12px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
.fld > span em { font-style: normal; text-transform: none; letter-spacing: 0; opacity: .8; }
input, textarea { font-family: var(--sans); font-size: 16px; background: var(--panel);
  border: 1px solid var(--line); color: var(--ink); border-radius: 9px; padding: 11px 12px; width: 100%; resize: vertical; }
input:focus-visible, textarea:focus-visible, button:focus-visible, a.btn:focus-visible {
  outline: 2px solid var(--gold); outline-offset: 2px; }
::placeholder { color: var(--ink-3); }

.btn { font-family: var(--sans); font-size: 15.5px; font-weight: 700; cursor: pointer;
       border-radius: 9px; padding: 12px 18px; border: 1px solid transparent; text-decoration: none;
       display: inline-flex; align-items: center; justify-content: center; }
.btn.gold { background: var(--gold); color: #17120b; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink-2); }
.btn.big { width: 100%; margin-top: 20px; padding: 15px; font-size: 16.5px; }

.out { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 20px; }
.out h2 { font-size: 15px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase;
          font-weight: 600; margin: 0 0 10px; }
pre { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
      padding: 13px 14px; margin: 0 0 13px; font-family: var(--sans); font-size: 14.5px;
      line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: var(--ink); }
.acts { display: flex; flex-wrap: wrap; gap: 9px; }
.tip { font-size: 13.5px; color: var(--ink-3); margin: 12px 0 0; }
.tip.bad { color: var(--bad); }
.tip b { color: var(--ink-2); font-weight: 600; }

.info { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 20px;
        display: grid; gap: 16px; }
.info h3 { font-family: var(--serif); font-size: 11.5px; letter-spacing: .24em; color: var(--gold);
           margin: 0 0 3px; font-weight: 400; }
.info p { margin: 0; font-size: 14.5px; color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<symbol id="gd-swag" viewBox="-8 44 816 153" preserveAspectRatio="none"><g fill="var(--crest-fill,#0b0908)" stroke="none"><ellipse cx="0" cy="90" rx="6" ry="8"/><ellipse cx="800" cy="90" rx="6" ry="8"/><path d="M80 123.4L91 139.9L80 156.4L69 139.9Z"/><path d="M160 138.6L171 155.1L160 171.6L149 155.1Z"/><path d="M240 151.8L251 168.3L240 184.8L229 168.3Z"/><path d="M320 139L331 155.5L320 172L309 155.5Z"/><path d="M400 148L411 164.5L400 181L389 164.5Z"/><path d="M480 155L491 171.5L480 188L469 171.5Z"/><path d="M560 135.8L571 152.3L560 168.8L549 152.3Z"/><path d="M640 138.6L651 155.1L640 171.6L629 155.1Z"/><path d="M720 139.4L731 155.9L720 172.4L709 155.9Z"/><rect x="75.5" y="73.4" width="9" height="26"/><rect x="235.5" y="85.8" width="9" height="26"/><rect x="395.5" y="90" width="9" height="26"/><rect x="555.5" y="85.8" width="9" height="26"/><rect x="715.5" y="73.4" width="9" height="26"/></g><g fill="none" stroke="var(--crest-line,#c6a15b)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 90Q400 142 800 90"/><ellipse cx="0" cy="90" rx="6" ry="8"/><ellipse cx="800" cy="90" rx="6" ry="8"/><path d="M80 99.4L80 123.4"/><path d="M80 123.4L91 139.9L80 156.4L69 139.9Z"/><path d="M160 106.6L160 138.6"/><path d="M160 138.6L171 155.1L160 171.6L149 155.1Z"/><path d="M240 111.8L240 151.8"/><path d="M240 151.8L251 168.3L240 184.8L229 168.3Z"/><path d="M320 115L320 139"/><path d="M320 139L331 155.5L320 172L309 155.5Z"/><path d="M400 116L400 148"/><path d="M400 148L411 164.5L400 181L389 164.5Z"/><path d="M480 115L480 155"/><path d="M480 155L491 171.5L480 188L469 171.5Z"/><path d="M560 111.8L560 135.8"/><path d="M560 135.8L571 152.3L560 168.8L549 152.3Z"/><path d="M640 106.6L640 138.6"/><path d="M640 138.6L651 155.1L640 171.6L629 155.1Z"/><path d="M720 99.4L720 139.4"/><path d="M720 139.4L731 155.9L720 172.4L709 155.9Z"/><rect x="75.5" y="73.4" width="9" height="26"/><rect x="235.5" y="85.8" width="9" height="26"/><rect x="395.5" y="90" width="9" height="26"/><rect x="555.5" y="85.8" width="9" height="26"/><rect x="715.5" y="73.4" width="9" height="26"/></g><g fill="var(--crest-flame,#c6a15b)" stroke="none"><ellipse cx="80" cy="62.4" rx="5" ry="11"/><ellipse cx="240" cy="74.8" rx="5" ry="11"/><ellipse cx="400" cy="79" rx="5" ry="11"/><ellipse cx="560" cy="74.8" rx="5" ry="11"/><ellipse cx="720" cy="62.4" rx="5" ry="11"/></g></symbol>
</svg>

<header class="top">
  <a class="brand" href="../">GD카페</a>
  <span class="sub">CHEONGDAM · SEOUL</span>
</header>

<main class="wrap">
  <div class="crest">
    <i class="ln"></i>
    <svg class="swag" viewBox="0 0 816 153" aria-hidden="true"><use href="#gd-swag"/></svg>
    <i class="ln"></i>
  </div>

  <h1>자리를 남겨두세요</h1>
  <p class="lead">검은 샹들리에 아래, 원하시는 시간을 알려주시면 매장에서 확인 후 회신드립니다.</p>
  <p class="notice"><b>예약은 매장 회신을 받으신 뒤 확정</b>됩니다. 아래 내용을 보내주시면 순서대로 확인합니다.</p>

  <form id="f" novalidate>
    <div class="row2">
      <label class="fld"><span>날짜</span><input id="date" type="date" required></label>
      <label class="fld"><span>시간</span><input id="time" type="time" step="1800" required></label>
    </div>
    <div class="row2">
      <label class="fld"><span>인원</span><input id="ppl" type="number" min="1" max="20" value="2" inputmode="numeric"></label>
      <label class="fld"><span>성함</span><input id="name" type="text" autocomplete="name" placeholder="예약자 성함"></label>
    </div>
    <label class="fld"><span>연락처</span>
      <input id="tel" type="tel" autocomplete="tel" inputmode="tel" placeholder="회신받으실 번호"></label>
    <label class="fld"><span>요청사항 <em>선택</em></span>
      <textarea id="memo" rows="2" placeholder="예: 창가 자리 / 기념일 / 촬영 문의"></textarea></label>
    <label class="fld" id="codewrap"><span>쿠폰 <em>가지고 계시면</em></span>
      <input id="code" type="text" spellcheck="false" placeholder="예: No.0001 / 대조 8BRU"></label>
  </form>

  <section class="out" id="out" hidden>
    <h2>보낼 내용</h2>
    <pre id="msg"></pre>
    <div class="acts">
      <button class="btn gold" id="b-copy">내용 복사</button>
      <a class="btn ghost" id="b-sms" hidden>문자로 보내기</a>
      <a class="btn ghost" id="b-insta" hidden>인스타그램 DM</a>
    </div>
    <p class="tip" id="tip"></p>
  </section>

  <button class="btn gold big" id="b-make">예약 내용 만들기</button>

  <section class="info">
    <div><h3>ADDRESS</h3><p>서울특별시 강남구 삼성로 716 (청담동) 2층</p></div>
    <div><h3>HOURS</h3><p>매일 11:00 – 22:00 · 라스트오더 21:30</p></div>
  </section>
</main>


<script>
/* ============================================================
   매장 연락 설정 — 채워 넣으면 버튼이 한 번에 열린다.
   비워두면 「내용 복사」만 노출된다 (동작에는 문제 없다).
   ============================================================ */
const STORE = {
  tel: "",        // 예: "02-000-0000"  → 「문자로 보내기」 활성화
  instagram: "",  // 예: "gdcafe.cheongdam" → 「인스타그램 DM」 활성화
};

const $ = id => document.getElementById(id);
const pad = (n, w) => String(n).padStart(w, "0");

/* QR 에 ?c=GD50-XXXX 가 붙어 오면 쿠폰 코드를 채워둔다 */
const params = new URLSearchParams(location.search);
const preCode = (params.get("c") || "").trim();
if (preCode) $("code").value = preCode;

/* 기본값 — 오늘 이후, 영업시간 안 */
(function initDefaults() {
  const d = new Date();
  if (d.getHours() >= 21) d.setDate(d.getDate() + 1);
  $("date").value = `${d.getFullYear()}-${pad(d.getMonth() + 1, 2)}-${pad(d.getDate(), 2)}`;
  $("date").min = `${d.getFullYear()}-${pad(d.getMonth() + 1, 2)}-${pad(d.getDate(), 2)}`;
  $("time").value = "19:00";
})();

function compose() {
  const date = $("date").value, time = $("time").value;
  const L = ["[GD카페 예약 요청]"];
  if (date) {
    const [y, m, dd] = date.split("-");
    const w = "일월화수목금토"[new Date(date + "T00:00").getDay()];
    L.push(`· 날짜 ${y}.${m}.${dd} (${w})`);
  }
  if (time) L.push(`· 시간 ${time}`);
  const ppl = $("ppl").value.trim(); if (ppl) L.push(`· 인원 ${ppl}명`);
  const name = $("name").value.trim(); if (name) L.push(`· 성함 ${name}`);
  const tel = $("tel").value.trim(); if (tel) L.push(`· 연락처 ${tel}`);
  const memo = $("memo").value.trim(); if (memo) L.push(`· 요청 ${memo}`);
  const code = $("code").value.trim(); if (code) L.push(`· 쿠폰 ${code}`);
  L.push("", "확인 후 회신 부탁드립니다.");
  return L.join("\n");
}

function validate() {
  if (!$("date").value) return "날짜를 골라주세요.";
  if (!$("time").value) return "시간을 골라주세요.";
  const t = $("time").value;
  if (t < "11:00" || t > "21:30") return "영업시간은 11:00–22:00 (라스트오더 21:30) 입니다.";
  if (!$("tel").value.trim() && !$("name").value.trim())
    return "회신을 위해 성함이나 연락처 중 하나는 남겨주세요.";
  return "";
}

$("b-make").addEventListener("click", () => {
  const err = validate();
  if (err) { $("tip").textContent = err; $("tip").className = "tip bad"; $("out").hidden = false; $("msg").textContent = ""; return; }
  const text = compose();
  $("msg").textContent = text;
  $("out").hidden = false;

  if (STORE.tel) {
    const a = $("b-sms");
    a.href = `sms:${STORE.tel.replace(/[^0-9+]/g, "")}${/iPhone|iPad|Macintosh/.test(navigator.userAgent) ? "&" : "?"}body=${encodeURIComponent(text)}`;
    a.hidden = false;
  }
  if (STORE.instagram) {
    const a = $("b-insta");
    a.href = `https://www.instagram.com/${STORE.instagram.replace(/^@/, "")}/`;
    a.hidden = false;
  }
  $("tip").className = "tip";
  $("tip").innerHTML = STORE.instagram || STORE.tel
    ? "버튼을 누르면 내용이 채워진 채로 열립니다. 보내주시면 매장에서 회신드립니다."
    : "내용을 복사한 뒤 <b>인스타그램에서 GD카페를 찾아 DM</b>으로 붙여넣어 주세요. 확인 후 회신드립니다.";
  $("out").scrollIntoView({ behavior: "smooth", block: "nearest" });
});

$("b-copy").addEventListener("click", async () => {
  const text = $("msg").textContent;
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    $("b-copy").textContent = "복사했습니다";
  } catch (e) {
    // 클립보드 권한이 없는 브라우저 — 선택 상태로 만들어 준다
    const r = document.createRange(); r.selectNodeContents($("msg"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    $("b-copy").textContent = "길게 눌러 복사하세요";
  }
  setTimeout(() => { $("b-copy").textContent = "내용 복사"; }, 2400);
});

</script>
</body>
</html>
