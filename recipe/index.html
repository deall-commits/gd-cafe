:root{
  --paper:#F4EFE6; --card:#EBE2D0; --ink:#1F1C17; --mid:#453E33; --mute:#645B4D;
  --rule:#D3C6AE; --rule2:#B3A183; --bronze:#6E5C33; --deep:#1F1C17; --on:#F6F2EA;
  --sans:'Pretendard GD','Pretendard',-apple-system,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);
     font-family:var(--sans);font-weight:450;
     font-feature-settings:"tnum" 1;letter-spacing:-.005em;
     display:flex;flex-direction:column;-webkit-text-size-adjust:100%;
     -webkit-font-smoothing:antialiased}

/* 위쪽 고정 — 메뉴가 늘 떠 있다 */
.top{flex:0 0 auto;background:var(--paper);border-bottom:2.5px solid var(--ink);
     padding:7px 16px 8px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.brand img{height:18px;width:auto}
.brand .t{font-size:16px;font-weight:700;letter-spacing:.2em}
.brand .s{margin-left:auto;font-size:15px;font-weight:500;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:7px;min-height:52px;padding:4px 12px 4px 5px;
      border:1.5px solid var(--rule2);border-radius:10px;background:none;cursor:pointer;
      font-family:inherit;font-size:19px;font-weight:600;color:var(--ink);line-height:1.2;
      letter-spacing:-.015em;white-space:nowrap;transition:none}
.chip .th{width:30px;height:30px;flex:0 0 30px;border-radius:6px;
          background:var(--card) center/cover no-repeat}
.chip .th.ph{display:flex;align-items:center;justify-content:center;color:var(--bronze)}
.chip .th.ph svg{width:20px;height:20px}
.chip[aria-pressed="true"]{background:var(--deep);color:var(--on);border-color:var(--deep)}
.chip:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}

/* 아래 — 선택한 메뉴의 제조 과정 */
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:11px 18px 13px}
.hd{display:flex;align-items:center;gap:16px;flex:0 0 auto;padding-bottom:8px;
    border-bottom:1.5px solid var(--rule)}
.hd h1{font-size:38px;font-weight:700;line-height:1.14;margin:0;letter-spacing:-.025em}
.hd .no{font-size:16px;font-weight:700;color:var(--bronze);margin-bottom:4px;letter-spacing:.06em}
.seg{margin-left:auto;display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{appearance:none;background:none;border:0;cursor:pointer;font-family:inherit;
   font-size:22px;font-weight:700;letter-spacing:.1em;min-width:110px;min-height:64px;color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--on)}
.cup{flex:1 1 auto;min-width:0;font-size:17px;font-weight:500;color:var(--mid);
     line-height:1.35;word-break:keep-all}
.cup b{display:block;font-weight:700;color:var(--mute);font-size:13px;letter-spacing:.1em;
     margin-bottom:2px}

.body{flex:1;min-height:0;display:flex;gap:24px;padding-top:8px}
.pane{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.pane::-webkit-scrollbar{width:9px}
.pane::-webkit-scrollbar-thumb{background:var(--rule2);border-radius:5px}
.panewrap{position:relative;min-height:0;display:flex;flex-direction:column}
.more{position:absolute;left:0;right:9px;bottom:0;height:64px;pointer-events:none;
      display:none;align-items:flex-end;justify-content:center;
      background:linear-gradient(to bottom,rgba(244,239,230,0),var(--paper) 42%,var(--paper))}
*{}
.more span{font-size:15px;font-weight:700;color:var(--bronze);letter-spacing:.04em;
      padding-bottom:2px}
.panewrap.on .more{display:flex}
.pane.mat,.pane.steps{flex:1;min-height:0}
h2.lb{font-size:15px;letter-spacing:.14em;color:var(--mute);font-weight:700;margin:0 0 9px}
.mathead{display:flex;align-items:baseline;gap:10px;margin:0 0 9px}
.mathead h2.lb{margin:0}
.cnt{font-size:15px;font-weight:700;color:var(--bronze);font-variant-numeric:tabular-nums}
.clr{margin-left:auto;appearance:none;background:none;border:1.5px solid var(--rule2);
     border-radius:8px;color:var(--mute);font-family:inherit;font-size:14px;font-weight:700;
     padding:7px 12px;min-height:40px;cursor:pointer}
.clr:disabled{opacity:.35}
table.m{width:100%;border-collapse:collapse}
table.m tr.ck{cursor:pointer}
table.m td.bx{width:40px;padding-right:12px;vertical-align:middle}
table.m td.bx span{display:block;width:32px;height:32px;border:2.5px solid var(--rule2);
     border-radius:8px;position:relative;background:var(--paper)}
table.m tr.ck.on td.bx span{background:var(--deep);border-color:var(--deep)}
table.m tr.ck.on td.bx span::after{content:"";position:absolute;left:9px;top:3px;
     width:9px;height:17px;border:solid var(--on);border-width:0 3.5px 3.5px 0;
     transform:rotate(42deg)}
table.m tr.ck.on td.n,table.m tr.ck.on td.a{color:var(--mute)}
table.m tr.ck.on td.n{text-decoration:line-through;text-decoration-thickness:2px}
table.m td{padding:7px 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
table.m td.n{font-size:25px;font-weight:500;line-height:1.3;letter-spacing:-.02em}
table.m td.a{text-align:right;white-space:nowrap;font-size:31px;font-weight:700;
             font-variant-numeric:tabular-nums;padding-left:10px;letter-spacing:-.01em}
table.m td.a small{font-size:17px;font-weight:600;color:var(--mid);margin-left:3px}
table.m td.a.none{color:var(--mute);font-size:20px;font-weight:600}
ol.st{list-style:none;margin:0;padding:0;counter-reset:s}
ol.st li{counter-increment:s;display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)}
ol.st li::before{content:counter(s);flex:0 0 36px;height:36px;border-radius:50%;
   background:var(--deep);color:var(--on);font-size:20px;font-weight:700;
   display:flex;align-items:center;justify-content:center}
ol.st .rail{flex:0 0 33%;text-align:right;padding-right:14px;border-right:1.5px solid var(--rule2)}
ol.st .rail div{font-size:18px;font-weight:500;line-height:1.45;color:var(--mid)}
ol.st .rail b{font-size:26px;font-weight:700;color:var(--ink);
              font-variant-numeric:tabular-nums;margin-left:5px;letter-spacing:-.01em}
ol.st .act{flex:1;min-width:0}
ol.st .a{font-size:27px;font-weight:600;line-height:1.34;word-break:keep-all;letter-spacing:-.022em}
ol.st .n{font-size:18px;font-weight:450;color:var(--mid);margin-top:4px;line-height:1.45;word-break:keep-all}
.tip{flex:0 0 auto;margin-top:6px;padding:8px 0 0;border-top:1.5px solid var(--rule);
     font-size:19px;font-weight:500;color:var(--mid);line-height:1.5;word-break:keep-all}
.tip #revert{margin-left:14px;min-height:40px;font-size:14px;padding:0 12px;vertical-align:middle}
.tip b{font-weight:700;color:var(--mute);font-size:14px;letter-spacing:.12em;margin-right:10px}

/* 세로 화면 */
/* ===== 탭 ===== */
.tabs{display:flex;gap:8px;align-items:center}
.tabs .lg{height:20px;width:auto;margin-right:6px;flex:0 0 auto}
.hintbar{font-size:14px;font-weight:600;color:var(--mute);padding:5px 2px 6px;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab{appearance:none;background:none;border:2px solid var(--rule2);border-radius:10px;
     font-family:inherit;font-size:18px;font-weight:700;color:var(--mute);
     padding:0 18px;min-height:50px;cursor:pointer;letter-spacing:-.02em}
.tab[aria-current="true"]{background:var(--deep);border-color:var(--deep);color:var(--on)}
.tools{margin-left:auto;display:flex;gap:8px}
.tool{appearance:none;background:none;border:2px solid var(--rule2);border-radius:10px;
      font-family:inherit;font-size:15px;font-weight:700;color:var(--mute);
      padding:0 14px;min-height:50px;cursor:pointer;white-space:nowrap}
.tool[aria-pressed="true"]{background:var(--bronze);border-color:var(--bronze);color:var(--on)}
.view{display:none}
.view.on{display:flex;flex-direction:column;flex:1;min-height:0}

/* ===== 체크리스트 · 재고 공통 ===== */
.ops{flex:1;min-height:0;overflow-y:auto;padding:4px 2px 8px}
.ops::-webkit-scrollbar{width:10px}
.ops::-webkit-scrollbar-thumb{background:var(--rule2);border-radius:5px}
.opshd{display:flex;align-items:center;gap:14px;padding:6px 0 12px;flex:0 0 auto;
       border-bottom:2px solid var(--ink);margin-bottom:10px}
.opshd h1{font-size:32px;font-weight:700;margin:0;letter-spacing:-.025em}
.opshd .prog{font-size:20px;font-weight:700;color:var(--bronze);font-variant-numeric:tabular-nums}
.opshd .day{font-size:16px;font-weight:600;color:var(--mute);margin-left:auto}
.bar{height:10px;border-radius:5px;background:var(--card);overflow:hidden;flex:0 0 auto;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--bronze);transition:width .18s}
.grp{margin-bottom:22px}
.grp>h3{font-size:16px;font-weight:700;letter-spacing:.1em;color:var(--mute);
        margin:0 0 8px;padding-bottom:6px;border-bottom:1.5px solid var(--rule)}
.row{display:flex;align-items:center;gap:14px;padding:12px 8px;border-bottom:1px solid var(--rule);
     cursor:pointer;border-radius:8px}
.row .bx{flex:0 0 34px;width:34px;height:34px;border:2.5px solid var(--rule2);border-radius:8px;
     position:relative;background:var(--paper)}
.row.on .bx{background:var(--deep);border-color:var(--deep)}
.row.on .bx::after{content:"";position:absolute;left:10px;top:3px;width:9px;height:18px;
     border:solid var(--on);border-width:0 3.5px 3.5px 0;transform:rotate(42deg)}
.row .tx{flex:1;min-width:0;font-size:23px;font-weight:600;line-height:1.35;
     word-break:keep-all;letter-spacing:-.022em}
.row.on .tx{color:var(--mute);text-decoration:line-through;text-decoration-thickness:2px}
.row .del{display:none;flex:0 0 auto;appearance:none;background:none;border:2px solid var(--rule2);
     border-radius:8px;color:var(--mute);font-family:inherit;font-size:15px;font-weight:700;
     min-height:42px;padding:0 12px;cursor:pointer}

/* 편집 모드 */
body.edit .row{cursor:default}
body.edit .row .bx{opacity:.3;pointer-events:none}
body.edit .row .del{display:block}
body.edit .row .tx{background:var(--paper);border:1.5px dashed var(--rule2);border-radius:8px;
     padding:6px 10px;outline:none}
body.edit .row .tx:focus{border-style:solid;border-color:var(--bronze)}
body.edit .grp>h3{outline:none;border-bottom-style:dashed}
body.edit .add{display:flex}
.add{display:none;align-items:center;gap:10px;margin-top:10px}
.add button{appearance:none;background:none;border:2px dashed var(--rule2);border-radius:9px;
     color:var(--mute);font-family:inherit;font-size:17px;font-weight:700;
     min-height:50px;padding:0 18px;cursor:pointer}
.editnote{display:none;font-size:16px;font-weight:600;color:var(--bronze);
     padding:10px 14px;background:var(--card);border-radius:10px;margin-bottom:12px}
body.edit .editnote{display:block}

/* ===== 재고 ===== */
table.stk{width:100%;border-collapse:collapse}
table.stk th{font-size:15px;font-weight:700;color:var(--mute);letter-spacing:.08em;
     text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink);white-space:nowrap}
table.stk th.r,table.stk td.r{text-align:right}
table.stk td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.stk td.nm{font-size:22px;font-weight:600;letter-spacing:-.02em;word-break:keep-all}
table.stk td.base{font-size:17px;font-weight:500;color:var(--mid);white-space:nowrap}
table.stk input.q{width:104px;font-family:inherit;font-size:24px;font-weight:700;text-align:right;
     border:2px solid var(--rule2);border-radius:9px;background:var(--paper);color:var(--ink);
     padding:9px 12px;min-height:54px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
table.stk input.q::-webkit-outer-spin-button,table.stk input.q::-webkit-inner-spin-button{
     -webkit-appearance:none;margin:0}
table.stk input.q:focus{outline:none;border-color:var(--bronze)}
.flag{display:inline-block;font-size:17px;font-weight:700;padding:7px 14px;border-radius:8px;
      white-space:nowrap}
.flag.no{background:#B0301E;color:#fff}
.flag.ok{background:var(--card);color:var(--mute)}
.stkgrp{font-size:16px;font-weight:700;letter-spacing:.1em;color:var(--mute);
      padding:20px 10px 8px;border-bottom:1.5px solid var(--rule)}
body.edit table.stk td.nm{background:var(--paper);border:1.5px dashed var(--rule2);
      border-radius:8px;outline:none}
body.edit table.stk td.nm:focus{border-style:solid;border-color:var(--bronze)}
body.edit .stkdel{display:inline-block}
.stkdel{display:none;appearance:none;background:none;border:2px solid var(--rule2);border-radius:8px;
      color:var(--mute);font-family:inherit;font-size:15px;font-weight:700;min-height:42px;
      padding:0 12px;cursor:pointer}

/* 레시피 안에서 고친 곳 */
body.edit .rxe{background:var(--paper);border:1.5px dashed var(--rule2);border-radius:6px;
      padding:2px 6px;outline:none}
body.edit .rxe:focus{border-style:solid;border-color:var(--bronze)}
.revert{display:none}
body.edit .revert{display:inline-block}

@media (max-aspect-ratio: 1/1){
  .body{flex-direction:column;gap:14px;overflow-y:auto}
  .pane{overflow:visible}
  .panewrap{flex:0 0 auto!important}
  table.stk td.base{display:none}
  table.stk th.base{display:none}
  .panewrap.on .more{display:none}
  ol.st .rail{flex:0 0 40%}
}
@media (prefers-color-scheme: dark){
  .tabs .lg{filter:invert(1) brightness(1.06)}
  .more{background:linear-gradient(to bottom,rgba(22,20,15,0),var(--paper) 42%,var(--paper))}
  :root{--paper:#16140F;--card:#221F18;--ink:#F3EDE1;--mid:#C6BCA8;--mute:#A79D8B;
        --rule:#3B352A;--rule2:#544B3B;--bronze:#D8B478;--deep:#0B0A07;--on:#F3EDE1}
  body{-webkit-font-smoothing:subpixel-antialiased}
  .brand img{filter:invert(1) brightness(1.06)}
}

const $=s=>document.querySelector(s);
let cur=D[0], mode='ice';

function chips(){
  const box=$('#chips'); box.innerHTML='';
  D.forEach(d=>{
    const b=document.createElement('button');
    b.type='button'; b.className='chip'; b.dataset.id=d.id;
    b.setAttribute('aria-pressed', String(d.id===cur.id));
    b.innerHTML=(d.th?`<span class="th" style="background-image:url(${d.th})"></span>`
                     :`<span class="th ph">${CUP}</span>`)+`<span>${d.ko}</span>`;
    b.addEventListener('click',()=>{ cur=d; mode='ice'; paint(); });
    box.appendChild(b);
  });
}
function num(v){
  const m=String(v).match(/^([\d.,~/+\s]+)(.*)$/);
  return m ? `${m[1].trim()}<small>${m[2].trim()}</small>` : v;
}
function hints(){
  document.querySelectorAll('.panewrap').forEach(w=>{
    const p=w.querySelector('.pane');
    w.classList.toggle('on', p.scrollHeight > p.clientHeight+2 &&
                             p.scrollTop + p.clientHeight < p.scrollHeight-2);
  });
}
document.addEventListener('scroll', hints, true);
addEventListener('resize', hints);
function tally(){
  const rows=$('#mat').querySelectorAll('tr.ck');
  const on=$('#mat').querySelectorAll('tr.ck.on').length;
  $('#cnt').textContent=on+' / '+rows.length;
  $('#clr').disabled = on===0;
}
function ov(k,d){ const o=S.rx[cur.id]; return (o&&o[k]!==undefined)?o[k]:d; }
function setOv(k,v,d){
  if(!S.rx[cur.id]) S.rx[cur.id]={};
  if(v===d) delete S.rx[cur.id][k]; else S.rx[cur.id][k]=v;
  if(!Object.keys(S.rx[cur.id]).length) delete S.rx[cur.id];
  save(); markRevert();
}
function bindRx(el,key,def){
  el.classList.add('rxe'); el.dataset.e='1';
  el.contentEditable=editing?'true':'false';
  el.addEventListener('blur',()=>setOv(key,el.textContent.trim(),def));
  el.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); el.blur(); } });
}
function markRevert(){
  const has=!!S.rx[cur.id];
  $('#revert').style.display = (editing&&has) ? 'inline-block' : 'none';
}
function paint(){
  document.querySelectorAll('.chip').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.id===cur.id)));
  const hot = mode==='hot' && cur.hasHot;
  const mq = hot ? (cur.mqh||cur.mq) : cur.mq;
  const steps = hot ? cur.hot : cur.ice;
  $('#no').textContent=cur.no;
  $('#name').textContent=cur.ko;
  $('#seg').style.display=cur.hasHot?'flex':'none';
  document.querySelectorAll('.seg button').forEach(b=>
    b.setAttribute('aria-selected', String(b.dataset.m===mode)));
  const cup=(hot&&cur.cuph)?cur.cuph:cur.cup;
  $('#cup').innerHTML=`<b>잔</b>${cup}${cur.cupSpec&&cur.cupSpec!=='—'?' · 담는 양 '+cur.cupSpec:''}`;
  const pre=mode+':';
  $('#mat').innerHTML=mq.map(([n,a],i)=>{
    const N=ov(pre+'mn'+i,n), A=ov(pre+'ma'+i,a||'적당량');
    return `<tr class="ck" data-i="${i}"><td class="bx"><span></span></td>`+
      `<td class="n"><span class="mn">${N}</span></td>`+
      `<td class="a${a?'':' none'}"><span class="ma">${a?num(A):A}</span></td></tr>`;
  }).join('');
  $('#mat').querySelectorAll('tr.ck').forEach((tr,i)=>{
    bindRx(tr.querySelector('.mn'),pre+'mn'+i,mq[i][0]);
    bindRx(tr.querySelector('.ma'),pre+'ma'+i,mq[i][1]||'적당량');
    tr.addEventListener('click',ev=>{
      if(editing||ev.target.classList.contains('mn')||ev.target.classList.contains('ma')) return;
      tr.classList.toggle('on'); tally(); });
  });
  tally();
  $('#steps').innerHTML=steps.map(s=>{
    const rail=s.m.length? s.m.map(x=>{
        const i=x.search(/\d/);
        return i<0?`<div>${x}</div>`:`<div>${x.slice(0,i)}<b>${x.slice(i)}</b></div>`;
      }).join('') : '<div>&nbsp;</div>';
    const i=steps.indexOf(s);
    return `<li><div class="rail">${rail}</div><div class="act">`+
           `<div class="a"><span class="sa">${ov(pre+'sa'+i,s.a)}</span></div>`+
           (s.n?`<div class="n"><span class="sn">${ov(pre+'sn'+i,s.n)}</span></div>`:'')+
           `</div></li>`;
  }).join('');
  $('#steps').querySelectorAll('li').forEach((li,i)=>{
    const a=li.querySelector('.sa'); if(a) bindRx(a,pre+'sa'+i,steps[i].a);
    const n=li.querySelector('.sn'); if(n) bindRx(n,pre+'sn'+i,steps[i].n);
  });
  $('#tip').innerHTML=`<b>포인트</b><span class="tp">${ov('tip',cur.tip)}</span>`+

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
                 +'-'+String(d.getDate()).padStart(2,'0');};
let S;
function load(){
  try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){ S=null; }
  if(!S||S.ver!==1) S={ver:1,open:null,close:null,stock:null,rx:{},check:{},day:''};
  ['open','close'].forEach(k=>{ if(!S[k]) S[k]=JSON.parse(JSON.stringify(DEF[k])); });
  if(!S.stock) S.stock=JSON.parse(JSON.stringify(DEF.stock));
  if(!S.rx) S.rx={};
  if(S.day!==today()){ S.day=today(); S.check={}; }
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){
  alert('저장 공간이 꽉 찼습니다. 내보내기로 백업한 뒤 브라우저 저장소를 비워 주세요.'); } }
load();

/* ================= 탭 ================= */
let view='rx';
function setView(v){
  view=v;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',String(b.dataset.v===v)));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  $('#chips').style.display = v==='rx' ? 'flex' : 'none';
  $('#hint').textContent = v==='rx' ? '메뉴를 누르면 아래에 만드는 법이 나옵니다'
    : (v==='stock' ? '현재 재고를 적으면 발주할 것이 자동으로 뜹니다'
                   : '누르면 체크됩니다. 날짜가 바뀌면 저절로 지워집니다');
  if(v==='open'||v==='close') drawList(v);
  if(v==='stock') drawStock();
  if(v==='rx') requestAnimationFrame(hints);
  try{ localStorage.setItem('gd.view',v); }catch(e){}
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));

/* ================= 편집 모드 ================= */
let editing=false;
$('#edit').addEventListener('click',()=>{
  editing=!editing;
  document.body.classList.toggle('edit',editing);
  $('#edit').setAttribute('aria-pressed',String(editing));
  $('#edit').textContent = editing ? '편집 끝' : '편집';
  document.querySelectorAll('[data-e]').forEach(el=>el.contentEditable=editing?'true':'false');
  if(!editing) save();
  if(view==='rx') paint();
});
function editable(el,fn){
  el.dataset.e='1'; el.contentEditable=editing?'true':'false';
  el.addEventListener('blur',()=>{ fn(el.textContent.trim()); save(); });
  el.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); el.blur(); } });
}

/* ================= 출근 · 퇴근 ================= */
function drawList(k){
  const box=$('#l-'+k); box.innerHTML='';
  S[k].forEach((g,gi)=>{
    const d=document.createElement('div'); d.className='grp';
    const h=document.createElement('h3'); h.textContent=g.t;
    editable(h,v=>{ g.t=v||'묶음'; });
    d.appendChild(h);
    g.items.forEach((tx,ii)=>{
      const id=k+':'+gi+':'+ii;
      const r=document.createElement('div'); r.className='row'+(S.check[id]?' on':'');
      const b=document.createElement('span'); b.className='bx';
      const t=document.createElement('span'); t.className='tx'; t.textContent=tx;
      editable(t,v=>{ g.items[ii]=v||'(빈 항목)'; });
      const x=document.createElement('button'); x.type='button'; x.className='del'; x.textContent='지움';
      x.addEventListener('click',ev=>{ ev.stopPropagation();
        g.items.splice(ii,1); save(); drawList(k); });
      r.append(b,t,x);
      r.addEventListener('click',ev=>{
        if(editing||ev.target===x) return;
        S.check[id]=!S.check[id]; r.classList.toggle('on',!!S.check[id]); save(); prog(k); });
      d.appendChild(r);
    });
    const add=document.createElement('div'); add.className='add';
    const ab=document.createElement('button'); ab.type='button'; ab.textContent='+ 항목';
    ab.addEventListener('click',()=>{ g.items.push('새 항목'); save(); drawList(k); });
    const gx=document.createElement('button'); gx.type='button'; gx.textContent='묶음 지움';
    gx.addEventListener('click',()=>{ if(confirm(g.t+' 묶음을 통째로 지울까요?')){
        S[k].splice(gi,1); save(); drawList(k); } });
    add.append(ab,gx); d.appendChild(add);
    box.appendChild(d);
  });
  const ng=document.createElement('div'); ng.className='add';
  const nb=document.createElement('button'); nb.type='button'; nb.textContent='+ 묶음';
  nb.addEventListener('click',()=>{ S[k].push({t:'새 묶음',items:['새 항목']}); save(); drawList(k); });
  const rb=document.createElement('button'); rb.type='button'; rb.textContent='기본값으로 되돌리기';
  rb.addEventListener('click',()=>{ if(confirm('고친 내용을 버리고 처음 상태로 되돌릴까요?')){
      S[k]=JSON.parse(JSON.stringify(DEF[k])); save(); drawList(k); } });
  ng.append(nb,rb); box.appendChild(ng);
  prog(k);
}
function prog(k){
  const n=S[k].reduce((a,g)=>a+g.items.length,0);
  let on=0; S[k].forEach((g,gi)=>g.items.forEach((_,ii)=>{ if(S.check[k+':'+gi+':'+ii]) on++; }));
  $('#p-'+k).textContent=on+' / '+n;
  $('#b-'+k).style.width=(n?on/n*100:0)+'%';
  $('#d-'+k).textContent=S.day+(on===n&&n?' · 다 했습니다':'');
}

/* ================= 재고 ================= */
function drawStock(){
  const box=$('#l-stock'); box.innerHTML='';
  const t=document.createElement('table'); t.className='stk';
  t.innerHTML='<thead><tr><th>재료</th><th class="base">한 잔 기준</th>'+
    '<th class="r">적정</th><th class="r">현재</th><th class="r">상태</th><th></th></tr></thead>';
  const tb=document.createElement('tbody'); let cat=null;
  S.stock.forEach((r,i)=>{
    if(r.cat!==cat){ cat=r.cat;
      const tr=document.createElement('tr');
      tr.innerHTML='<td class="stkgrp" colspan="6">'+cat+'</td>'; tb.appendChild(tr); }
    const tr=document.createElement('tr');
    const nm=document.createElement('td'); nm.className='nm'; nm.textContent=r.nm;
    editable(nm,v=>{ r.nm=v||'(이름 없음)'; });
    const bs=document.createElement('td'); bs.className='base'; bs.textContent=r.base;
    const mk=(key,ph)=>{ const td=document.createElement('td'); td.className='r';
      const inp=document.createElement('input'); inp.className='q'; inp.type='number';
      inp.inputMode='decimal'; inp.placeholder=ph;
      inp.value=(r[key]===undefined||r[key]===null)?'':r[key];
      inp.addEventListener('input',()=>{ r[key]=inp.value===''?null:Number(inp.value);
        save(); paintFlag(); }); td.appendChild(inp); return td; };
    const st=document.createElement('td'); st.className='r flagcell';
    const x=document.createElement('td'); x.className='r';
    const xb=document.createElement('button'); xb.type='button'; xb.className='stkdel'; xb.textContent='지움';
    xb.addEventListener('click',()=>{ S.stock.splice(i,1); save(); drawStock(); });
    x.appendChild(xb);
    tr.append(nm,bs,mk('par','-'),mk('now','-'),st,x);
    tb.appendChild(tr);
  });
  t.appendChild(tb); box.appendChild(t);
  const add=document.createElement('div'); add.className='add';
  const ab=document.createElement('button'); ab.type='button'; ab.textContent='+ 재료';
  ab.addEventListener('click',()=>{ S.stock.push({id:'x'+S.stock.length,cat:'직접 넣은 것',
    nm:'새 재료',base:'',use:0}); save(); drawStock(); });
  const cb=document.createElement('button'); cb.type='button'; cb.textContent='현재 재고 비우기';
  cb.addEventListener('click',()=>{ if(confirm('적어 둔 현재 재고를 모두 지울까요?')){
      S.stock.forEach(r=>r.now=null); save(); drawStock(); } });
  add.append(ab,cb); box.appendChild(add);
  paintFlag();
}
function paintFlag(){
  let need=0;
  const cells=$('#l-stock').querySelectorAll('td.flagcell');
  let i=0;
  S.stock.forEach(r=>{
    const c=cells[i++]; if(!c) return;
    if(r.par===undefined||r.par===null||r.now===undefined||r.now===null){ c.innerHTML=''; return; }
    const bad=Number(r.now)<Number(r.par); if(bad) need++;
    c.innerHTML='<span class="flag '+(bad?'no':'ok')+'">'+(bad?'발주':'충분')+'</span>';
  });
  $('#p-stock').textContent = need ? '발주 '+need+'건' : '';
}

$('#io').addEventListener('click',()=>{
  const txt=JSON.stringify(S);
  const w=prompt('이 글자를 모두 복사해 두면 다른 기기에서 그대로 옮길 수 있습니다.\n'+
                 '다른 기기 것을 가져오려면, 이 칸을 지우고 복사한 글자를 붙여 넣은 뒤 확인을 누르세요.', txt);
  if(w===null||w===txt) return;
  try{ const o=JSON.parse(w); if(o&&o.ver===1){ S=o; S.day=today(); save(); setView(view);
       alert('가져왔습니다.'); } else alert('형식이 맞지 않습니다.'); }
  catch(e){ alert('붙여 넣은 글자를 읽지 못했습니다.'); }
});

chips(); paint();
try{ const v=localStorage.getItem('gd.view'); if(v&&v!=='rx') setView(v); }catch(e){}
