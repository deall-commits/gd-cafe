<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>GD CAFE 레시피 · 아이패드</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4EFE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GD 레시피">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Nanum+Myeongjo:wght@400;700&display=swap">
<style>
:root{
  --paper:#F4EFE6; --card:#EBE2D0; --ink:#23201B; --mid:#4E463B; --mute:#7A7062;
  --rule:#DED2BC; --rule2:#C4B294; --bronze:#8A6A3A; --deep:#23201B; --on:#F4EFE6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);
     font-family:'Nanum Myeongjo','Noto Serif KR',serif;
     display:flex;flex-direction:column;-webkit-text-size-adjust:100%}

/* 위쪽 고정 — 메뉴가 늘 떠 있다 */
.top{flex:0 0 auto;background:var(--paper);border-bottom:2px solid var(--ink);
     padding:8px 16px 10px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:7px}
.brand img{height:18px;width:auto}
.brand .t{font-family:'Bodoni Moda',serif;font-size:16px;letter-spacing:.18em}
.brand .s{margin-left:auto;font-size:13px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:8px;min-height:50px;padding:5px 12px 5px 6px;
      border:1.5px solid var(--rule2);border-radius:9px;background:none;cursor:pointer;
      font-family:inherit;font-size:16px;color:var(--ink);line-height:1.2;
      white-space:nowrap;transition:none}
.chip .th{width:34px;height:34px;flex:0 0 34px;border-radius:6px;
          background:var(--card) center/cover no-repeat}
.chip .th.ph{display:flex;align-items:center;justify-content:center;color:var(--bronze)}
.chip .th.ph svg{width:19px;height:19px}
.chip[aria-pressed="true"]{background:var(--deep);color:var(--on);border-color:var(--deep)}
.chip:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}

/* 아래 — 선택한 메뉴의 제조 과정 */
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:11px 18px 13px}
.hd{display:flex;align-items:center;gap:16px;flex:0 0 auto;padding-bottom:9px;
    border-bottom:1px solid var(--rule)}
.hd h1{font-size:30px;font-weight:400;line-height:1.15;margin:0;letter-spacing:-.01em}
.hd .no{font-family:'Bodoni Moda',serif;font-size:16px;color:var(--bronze);margin-bottom:4px}
.seg{margin-left:auto;display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{appearance:none;background:none;border:0;cursor:pointer;font-family:'Bodoni Moda',serif;
   font-size:19px;letter-spacing:.12em;min-width:96px;min-height:56px;color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--on)}
.cup{flex:0 0 auto;font-size:16px;color:var(--mid);padding:9px 0 0}
.cup b{font-weight:400;color:var(--mute);font-size:14px;letter-spacing:.14em;margin-right:10px}

.body{flex:1;min-height:0;display:flex;gap:24px;padding-top:10px}
.pane{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pane.mat{flex:0 0 34%}
.pane.steps{flex:1}
h2.lb{font-size:14px;letter-spacing:.22em;color:var(--mute);font-weight:400;margin:0 0 8px}
table.m{width:100%;border-collapse:collapse}
table.m td{padding:6px 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
table.m td.n{font-size:18px;line-height:1.3}
table.m td.a{text-align:right;white-space:nowrap;font-family:'Bodoni Moda',serif;font-size:25px;
             font-variant-numeric:tabular-nums;padding-left:10px}
table.m td.a small{font-family:'Nanum Myeongjo',serif;font-size:15px;color:var(--mid);margin-left:2px}
table.m td.a.none{color:var(--mute);font-size:17px}
ol.st{list-style:none;margin:0;padding:0;counter-reset:s}
ol.st li{counter-increment:s;display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule)}
ol.st li::before{content:counter(s);flex:0 0 30px;height:30px;border-radius:50%;
   background:var(--deep);color:var(--on);font-family:'Bodoni Moda',serif;font-size:18px;
   display:flex;align-items:center;justify-content:center}
ol.st .rail{flex:0 0 33%;text-align:right;padding-right:14px;border-right:1px solid var(--rule2)}
ol.st .rail div{font-size:15px;line-height:1.4;color:var(--mid)}
ol.st .rail b{font-family:'Bodoni Moda',serif;font-size:21px;font-weight:400;color:var(--ink);
              font-variant-numeric:tabular-nums;margin-left:5px}
ol.st .act{flex:1;min-width:0}
ol.st .a{font-size:21px;line-height:1.35;word-break:keep-all}
ol.st .n{font-size:14px;color:var(--mute);margin-top:4px;line-height:1.45;word-break:keep-all}
.tip{flex:0 0 auto;margin-top:8px;padding:9px 0 0;border-top:1px solid var(--rule);
     font-size:16px;color:var(--mid);line-height:1.5;word-break:keep-all}
.tip b{font-weight:400;color:var(--mute);font-size:13px;letter-spacing:.16em;margin-right:10px}

/* 세로 화면 */
@media (max-aspect-ratio: 1/1){
  .body{flex-direction:column;gap:14px;overflow-y:auto}
  .pane{overflow:visible}
  .pane.mat{flex:0 0 auto}
  ol.st .rail{flex:0 0 40%}
}
@media (prefers-color-scheme: dark){
  :root{--paper:#16140F;--card:#221F18;--ink:#EFE8DA;--mid:#B5AB99;--mute:#948B7B;
        --rule:#332E24;--rule2:#4A4234;--bronze:#CFA76B;--deep:#0E0C09;--on:#EFE8DA}
  .brand img{filter:invert(1) brightness(1.06)}
}
</style></head><body>

    box.appendChild(b);
  });
}
function num(v){
  const m=String(v).match(/^([\d.,~/+\s]+)(.*)$/);
  return m ? `${m[1].trim()}<small>${m[2].trim()}</small>` : v;
}
function paint(){
  document.querySelectorAll('.chip').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.id===cur.id)));
  const hot = mode==='hot' && cur.hasHot;
  const mq = hot ? (cur.mqh||cur.mq) : cur.mq;
  const steps = hot ? cur.hot : cur.ice;
  $('#no').textContent=cur.no;
  $('#name').textContent=cur.ko;
  $('#seg').style.display=cur.hasHot?'flex':'none';
  document.querySelectorAll('.seg button').forEach(b=>
    b.setAttribute('aria-selected', String(b.dataset.m===mode)));
  const cup=(hot&&cur.cuph)?cur.cuph:cur.cup;
  $('#cup').innerHTML=`<b>잔</b>${cup}${cur.cupSpec&&cur.cupSpec!=='—'?' · 담는 양 '+cur.cupSpec:''}`;
  $('#mat').innerHTML=mq.map(([n,a])=>
    `<tr><td class="n">${n}</td><td class="a${a?'':' none'}">${a?num(a):'적당량'}</td></tr>`).join('');
  $('#steps').innerHTML=steps.map(s=>{
    const rail=s.m.length? s.m.map(x=>{
        const i=x.search(/\d/);
        return i<0?`<div>${x}</div>`:`<div>${x.slice(0,i)}<b>${x.slice(i)}</b></div>`;
      }).join('') : '<div>&nbsp;</div>';
    return `<li><div class="rail">${rail}</div><div class="act"><div class="a">${s.a}</div>`+
           (s.n?`<div class="n">${s.n}</div>`:'')+`</div></li>`;
  }).join('');
  $('#tip').innerHTML=`<b>포인트</b>${cur.tip}`;
  document.querySelectorAll('.pane').forEach(p=>p.scrollTop=0);
  try{ localStorage.setItem('gd.ipad', cur.id); }catch(e){}
}
document.querySelectorAll('.seg button').forEach(b=>
  b.addEventListener('click',()=>{ mode=b.dataset.m; paint(); }));
try{ const last=localStorage.getItem('gd.ipad');
     const f=D.find(x=>x.id===last); if(f) cur=f; }catch(e){}
chips(); paint();
</script>
</body></html>
